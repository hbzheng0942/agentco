# LiteLLM proxy — 统一 OpenAI 兼容入口 http://127.0.0.1:4000/v1
# 模型ID若官方更名,只改此文件,Codex侧别名不变。
model_list:
  - model_name: ds-chat                # 廉价主力:Exec/Router类任务
    litellm_params:
      model: deepseek/deepseek-v4-flash  # 旧名 deepseek-chat 2026-07-24 弃用
      api_key: os.environ/DEEPSEEK_API_KEY
      extra_body:
        thinking: {type: disabled}       # v4默认开思考;chat档对齐旧deepseek-chat语义=关

  - model_name: ds-reasoner            # 升级档一:推理
    litellm_params:
      model: deepseek/deepseek-v4-pro  # 旧名 deepseek-reasoner 2026-07-24 弃用
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: qwen-max               # auditor 主力:qwen3.7-max(DashScope OpenAI兼容,原生支持Responses;贵,只给审计)
    litellm_params:
      model: openai/qwen3.7-max
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: gpt-plus               # GPT升级档:ChatGPT Plus经CLIProxyAPI(127.0.0.1:8317)
    litellm_params:                    # ⚠️ 需 cli-proxy-api --codex-device-login 登录后生效
      model: openai/gpt-5.5            # TODO:登录后 curl :8317/v1/models 校准 model 名
      api_base: http://127.0.0.1:8317/v1
      api_key: os.environ/CLIPROXY_API_KEY

  - model_name: kimi-long              # 长上下文:Intel抓取/论文初筛
    litellm_params:
      model: openai/kimi-k2.6          # Kimi OpenAI-compatible endpoint
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY

router_settings:
  fallbacks:
    - kimi-long: ["ds-chat"]           # Kimi挂了降级DeepSeek,保cron不断
    - ds-chat: ["kimi-long"]           # 反向兜底:DeepSeek挂了整链不至于全断
    - qwen-max: ["ds-chat"]            # auditor兜底:qwen挂了降ds-chat(hook出站通知,见litellm_hooks)
    - gpt-plus: ["ds-reasoner"]        # GPT通道兜底:CLIProxyAPI未登录/断供→ds-reasoner(hook出站通知)
  num_retries: 2
  timeout: 120

litellm_settings:
  max_budget: 200          # 月度硬顶(USD),撞顶拒绝请求并报错
  budget_duration: 30d
  drop_params: true        # 吞掉厂商不支持的参数,防tool-call格式炸
  callbacks: litellm_hooks.proxy_handler_instance  # 剥离codex内置非function工具(namespace等),防上游400

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
